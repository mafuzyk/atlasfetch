[package]
name = "halofetch"
version = "3.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "System information fetch with centered logos, powerline panels and a live monitor"
repository = "https://github.com/mafuzyk/halofetch"
readme = "README.md"
keywords = ["fetch", "linux", "terminal", "system-information", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "halofetch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
color-eyre = "0.6"
directories = "6"
unicode-width = "0.2"
regex = "1"
portable-pty = "0.9.0"
vt100 = { version = "0.15.2", package = "vt100" }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
